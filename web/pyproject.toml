[project]
name = "hubsite"
version = "0.1.0"
description = "Offline Hugging Face-style model browser that reads a modelhub model store."
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "jinja2>=3.1", "markdown-it-py>=3.0", "mdit-py-plugins>=0.4", "nh3>=0.2.18"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
hubsite = "hubsite.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
hubsite = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]  # B008: FastAPI declares query parameters as default values
