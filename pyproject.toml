[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modelhub"
version = "1.0.0"
description = "Download Hugging Face repos into airgap-transferable bundles and restore them on-prem"
readme = "README.md"
requires-python = ">=3.10"
# huggingface_hub: the web session, progress hook and fast-transfer behaviour used here were
# checked against 2.2; an older release may differ.
dependencies = ["typer>=0.12", "huggingface_hub>=2.2,<3", "cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2", "ruff>=0.5", "tomli>=2; python_version < '3.11'"]
build = ["pyinstaller>=6", "nuitka>=2"]

[project.scripts]
modelhub = "modelhub.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/modelhub"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: tests that use the real internet; run only on request with -m network"]
addopts = "-m 'not network'"
