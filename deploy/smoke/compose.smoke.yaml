# Added to compose.yaml for CI's whole-stack smoke test only: the two outside systems as
# stand-ins, the proxy reachable under the test host name, and a driver that plays a browser
# and an import computer. Never part of a server pack. The stand-ins stand for outside systems,
# so an upgrade of the product leaves them running (SMOKE_VERSION stays fixed).
services:
  standins:
    image: modelhub/smoke:${SMOKE_VERSION:?}
    command: ["python", "/smoke/standins.py"]
    networks: {internal: {}}
    secrets: [artifactory_token]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; [socket.create_connection(('127.0.0.1', p), 3).close() for p in (9000, 9100)]"]
      interval: 5s
      timeout: 5s
      retries: 20
  catalog:
    depends_on:
      standins: {condition: service_healthy}
  artifactory-service:
    depends_on:
      standins: {condition: service_healthy}
  portal:
    depends_on:
      standins: {condition: service_healthy}
  proxy:
    networks:
      internal: {aliases: [modelhub.test]}
    ports: !reset []   # the network has no route out, so nothing is published; the driver is inside it
  driver:
    image: modelhub/smoke:${SMOKE_VERSION:?}
    profiles: [driver]
    networks: {internal: {}}
    environment:
      PORTAL: https://modelhub.test:8443
      SSL_CERT_FILE: /certs/modelhub.crt
      STATE: /state
    volumes:
      - smoke-state:/state
      - ./secrets/tls_certificate:/certs/modelhub.crt:ro
    depends_on:
      proxy: {condition: service_healthy}
# The whole smoke test and rehearsal run on a network with no route to the internet: if the stack
# needed to download or call anything outside, it would fail here (platform NFR8.1).
networks:
  internal:
    internal: true
volumes:
  smoke-state: {}
