# A real Keycloak for TESTING ModelHub's sign-in, already set up for ModelHub (modelhub-realm.json).
# Test and development only: fixed test secrets, development mode, no certificate, no database of
# its own. It is never part of the signed server pack. Start it alone:
#   docker compose -f deploy/keycloak/compose.keycloak.yaml up -d --wait
# or beside the stack and the Artifactory stand-in with deploy/keycloak/up.sh.
#
# The address is the container's own name, so the issuer is the same for the portal, the import
# service and the Catalog (inside the network) and, with the name "keycloak" mapped to 127.0.0.1
# on the computer, for a browser and for tests there:
#   http://keycloak:8080/realms/modelhub
name: modelhub

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-password-test-not-for-production
      KC_HOSTNAME: http://keycloak:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "false"
      KC_HEALTH_ENABLED: "true"
      KC_LOG_LEVEL: warn
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - ./modelhub-realm.json:/opt/keycloak/data/import/modelhub-realm.json:ro
    networks: {internal: {}}
    healthcheck:
      # the image has bash but no curl: ready when the realm's discovery address answers 200
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /realms/modelhub/.well-known/openid-configuration HTTP/1.1\r\nHost: keycloak:8080\r\nConnection: close\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q ' 200 '
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

networks:
  internal:
    name: modelhub-internal
