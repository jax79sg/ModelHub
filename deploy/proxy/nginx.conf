# Entry point: TLS ends here. Only the web pages and the import calls are routed; the Catalog,
# the retention and key calls and everything else under /v1 are not reachable from outside.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server_tokens off;

    log_format json escape=json
        '{"time":"$time_iso8601","event":"access","requestId":"$request_id",'
        '"method":"$request_method","path":"$uri","status":$status,'
        '"bytes":$body_bytes_sent,"duration_s":$request_time}';
    access_log /dev/stdout json;

    map $http_x_request_id $req_id { default $http_x_request_id; "" $request_id; }

    upstream portal { server portal:8000; }
    upstream artifactory_service { server artifactory-service:8000; }

    server {
        listen 8443 ssl;
        ssl_certificate /run/secrets/tls_certificate;
        ssl_certificate_key /run/secrets/tls_key;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header Strict-Transport-Security "max-age=31536000" always;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-Id $req_id;

        # The CLI's import calls. Pieces are large: no body limit, no buffering, long reads.
        location /v1/imports {
            client_max_body_size 0;
            proxy_request_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_pass http://artifactory_service;
        }

        # Nothing else under /v1 is reachable from outside.
        location /v1/ { return 404; }

        location / {
            client_max_body_size 1m;
            proxy_read_timeout 60s;
            proxy_pass http://portal;
        }
    }
}
