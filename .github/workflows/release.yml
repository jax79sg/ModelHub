# Publishing: push a tag such as v1.0.0. All checks run first; the files are then attached to a
# GitHub release, ready to carry to the air-gapped side.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
      - name: Zip the offline packs
        run: |
          cd files
          for d in modelhub-pack-*; do zip -r "$d.zip" "$d" && rm -r "$d"; done
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find files -type f | sort
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes \
            $(find files -type f)
