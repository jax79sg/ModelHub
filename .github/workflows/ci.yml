# Automatic checks for modelhub. A change cannot merge to main unless every job here passes.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -v --timeout=240 --durations=15
        env:
          PYTHONUNBUFFERED: "1"

  # Built inside an old RHEL 8 compatible system so the file does not need a newer system library
  # than RHEL 8 and Ubuntu 20.04 have (NFR7.2).
  build-linux:
    runs-on: ubuntu-latest
    container: almalinux:8
    steps:
      - run: dnf install -y git python3.12 python3.12-pip binutils
      - uses: actions/checkout@v4
      - run: python3.12 -m pip install -e ".[build]"
      - run: python3.12 packaging/build.py pyinstaller
      - run: python3.12 packaging/roundtrip_smoke.py dist/modelhub-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: modelhub-linux-x86_64
          path: dist/modelhub-linux-x86_64
          if-no-files-found: error

  # The same file, started on an older Ubuntu that has no Python of ours installed.
  run-linux-on-ubuntu-20-04:
    needs: build-linux
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    steps:
      - run: apt-get update && apt-get install -y python3 ca-certificates
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: modelhub-linux-x86_64
          path: dist
      - run: chmod +x dist/modelhub-linux-x86_64
      - run: python3 packaging/roundtrip_smoke.py dist/modelhub-linux-x86_64

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[build]"
      - run: python packaging/build.py pyinstaller
      - run: python packaging/roundtrip_smoke.py dist/modelhub-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: modelhub-windows-x86_64.exe
          path: dist/modelhub-windows-x86_64.exe
          if-no-files-found: error

  # macOS on Apple Silicon: macos-latest is an arm64 Mac, so this builds and runs the real file.
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[build]"
      - run: python packaging/build.py pyinstaller
      - run: python packaging/roundtrip_smoke.py dist/modelhub-darwin-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: modelhub-darwin-arm64
          path: dist/modelhub-darwin-arm64
          if-no-files-found: error

  # Offline install packs for computers that have Python but no internet.
  offline-pack:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python packaging/offline_pack.py pack
      - run: pip install --no-index --find-links pack modelhub
      - run: modelhub --version
      - uses: actions/upload-artifact@v4
        with:
          name: modelhub-pack-${{ runner.os }}-py${{ matrix.python }}
          path: pack
          if-no-files-found: error

  # The web app that reads a model store (web/). It has its own dependencies and ruff settings.
  web:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -v

  # The server units (server/): common, catalog, artifactory_service, portal, stand_in, and the test helpers.
  # Tests that need PostgreSQL use this service container (MODELHUB_TEST_POSTGRES_URL).
  server:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MODELHUB_TEST_POSTGRES_URL: postgresql://postgres:test@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: >-
          pip install pytest pytest-timeout -e .
          -e server/testkit -e server/common -e "server/stand_in[test]"
          -e web -e server/catalog -e server/artifactory_service -e server/portal
      # one run per unit: the units share test file names
      - run: |
          for unit in common catalog artifactory_service portal e2e stand_in testkit; do
            pytest server/$unit -v --timeout=240 || exit 1
          done

  # The portal in Google Chrome (portal NFR10.1, Chrome only by the person's choice): a real browser
  # drives the real portal on local ports. The runner's own Chrome is used; nothing is downloaded.
  browser-chrome:
    name: browser (chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MODELHUB_TEST_POSTGRES_URL: postgresql://postgres:test@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: google-chrome --version
      - run: >-
          pip install pytest pytest-timeout playwright -e .
          -e server/testkit -e server/common -e "server/stand_in[test]"
          -e web -e server/catalog -e server/artifactory_service -e server/portal
      - run: pytest server/e2e/tests/test_chrome.py -v --timeout=240 -rs

  # The stand-in must run the same where the import command is tested (NFR10): Windows and macOS too.
  stand-in:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest pytest-timeout -e server/testkit -e "server/stand_in[test]"
      - run: pytest server/stand_in -v --timeout=240

  # The server images (deploy/): built, checked and scanned on every change (NFR5.1, NFR5.6, NFR5.7).
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE: ci-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the Compose file reads with example values
        run: |
          cp deploy/env.example deploy/.env
          mkdir -p deploy/secrets
          for s in database_migration_password catalog_db_password service_db_password token_hash_pepper artifactory_token keycloak_client_secret_portal keycloak_client_secret_service tls_certificate tls_key; do echo x > deploy/secrets/$s; done
          cd deploy
          MODELHUB_VERSION=$RELEASE POSTGRES_IMAGE=postgres:16 KEYCLOAK_ISSUER=https://kc.example/realms/m \
            docker compose --env-file .env config --quiet
      - name: Build the images
        run: |
          for unit in catalog artifactory_service portal; do
            name=${unit//_/-}
            docker build -f deploy/Dockerfile --build-arg UNIT=$unit --build-arg RELEASE=$RELEASE -t modelhub/$name:$RELEASE .
          done
          docker build -f deploy/proxy/Dockerfile -t modelhub/proxy:$RELEASE .
      - name: The stand-ins and test helpers are in no image
        run: |
          for name in catalog artifactory-service portal; do
            docker run --rm --entrypoint python modelhub/$name:$RELEASE -c "
          import importlib.util, sys
          bad = [m for m in ('modelhub_stand_in', 'modelhub_testkit') if importlib.util.find_spec(m)]
          sys.exit('found ' + ', '.join(bad) if bad else 0)"
          done
      - name: The JFrog CLI is in the import service image and in no other
        run: |
          docker run --rm --entrypoint sh modelhub/artifactory-service:$RELEASE -c 'jf --version'
          for name in catalog portal proxy; do
            if docker run --rm --entrypoint sh modelhub/$name:$RELEASE -c 'command -v jf'; then
              echo "jf found in $name"; exit 1
            fi
          done
      - name: No image carries a secret-looking environment value
        run: |
          for name in catalog artifactory-service portal proxy; do
            if docker inspect modelhub/$name:$RELEASE --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -Ei '(password|secret|token|pepper)='; then
              echo "secret-looking variable in $name"; exit 1
            fi
          done
      - name: Each app image starts as a non-root user
        run: |
          for name in catalog artifactory-service portal; do
            test "$(docker run --rm --entrypoint id modelhub/$name:$RELEASE -u)" = "10001"
          done
      - name: Scan (fails on a critical finding that has a fix)
        run: |
          for name in catalog artifactory-service portal proxy; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.57.1 image \
              --severity CRITICAL --ignore-unfixed --exit-code 1 modelhub/$name:$RELEASE
          done
      - name: Whole-stack smoke test and upgrade-and-return rehearsal
        run: |
          docker build -f deploy/smoke/Dockerfile -t modelhub/smoke:$RELEASE .
          FROM=$RELEASE deploy/smoke/run.sh

  # The signed server pack, made on every merge to main (the key comes from repository secrets;
  # without them the pack is built unsigned and must not be carried across).
  server-pack:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE: main-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Build the images
        run: |
          for unit in catalog artifactory_service portal; do
            name=${unit//_/-}
            docker build -f deploy/Dockerfile --build-arg UNIT=$unit --build-arg RELEASE=$RELEASE -t modelhub/$name:$RELEASE .
          done
          docker build -f deploy/proxy/Dockerfile -t modelhub/proxy:$RELEASE .
      - name: Put the signing key in place
        env:
          KEY_ID: ${{ secrets.PACK_KEY_ID }}
          KEY_PRIVATE: ${{ secrets.PACK_KEY_PRIVATE_B64 }}
          KEY_PUBLIC: ${{ secrets.PACK_KEY_PUBLIC_B64 }}
        run: |
          if [ -n "$KEY_ID" ]; then
            mkdir -p "$RUNNER_TEMP/mh/keys"
            echo "$KEY_PRIVATE" | base64 -d > "$RUNNER_TEMP/mh/keys/$KEY_ID.key"
            echo "$KEY_PUBLIC" | base64 -d > "$RUNNER_TEMP/mh/keys/$KEY_ID.pub.json"
            chmod 600 "$RUNNER_TEMP/mh/keys/$KEY_ID.key"
            echo "MODELHUB_HOME=$RUNNER_TEMP/mh" >> "$GITHUB_ENV"
            echo "KEY_ID=$KEY_ID" >> "$GITHUB_ENV"
          else
            echo "No signing key is configured; the pack will be unsigned."
          fi
      - name: Build the pack
        run: OUT="$RUNNER_TEMP/pack" deploy/build-pack.sh
      - name: Check the pack is signed and holds no stand-in
        run: |
          if [ -n "${KEY_ID:-}" ]; then modelhub pack verify "$RUNNER_TEMP/pack"; fi
          ! grep -Ei 'smoke|stand|driver|testkit' "$RUNNER_TEMP/pack/SHA256SUMS" 2>/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: server-pack-${{ github.sha }}
          path: ${{ runner.temp }}/pack
          retention-days: 30
