name: diag
on: workflow_dispatch
jobs:
  win:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: |
          python -c "
          import tempfile, pathlib
          t = pathlib.Path(tempfile.mkdtemp())
          for root in (t, t / 'work' / 'files'):
              base = root.resolve()
              target = (base / 'config.json').resolve()
              print('root  ', repr(str(root)))
              print('base  ', repr(str(base)))
              print('target', repr(str(target)))
              print('parents', [str(p) for p in target.parents][:3])
          "
        continue-on-error: true
