[project]
name = "modelhub-catalog"
version = "0.1.0"
description = "The Catalog: the only reader and writer of model information, the import trail and personal tokens."
requires-python = ">=3.10"
dependencies = ["modelhub-common", "fastapi>=0.115", "uvicorn>=0.30", "psycopg[binary,pool]>=3.2", "python-multipart>=0.0.9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
