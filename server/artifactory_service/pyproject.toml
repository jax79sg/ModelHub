[project]
name = "modelhub-artifactory-service"
version = "0.1.0"
description = "Import, trusted keys and retention against Artifactory."
requires-python = ">=3.10"
dependencies = ["modelhub", "modelhub-common", "fastapi>=0.115", "uvicorn>=0.30", "psycopg[binary,pool]>=3.2", "httpx>=0.27", "huggingface_hub>=2.2,<3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
modelhub_artifactory_service = ["migrations/*.sql"]
