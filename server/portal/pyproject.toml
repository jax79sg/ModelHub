[project]
name = "modelhub-portal"
version = "0.1.0"
description = "The signed-in web pages: models, tokens, retention and keys."
requires-python = ">=3.10"
dependencies = ["modelhub-common", "hubsite", "fastapi>=0.115", "uvicorn>=0.30", "jinja2>=3.1", "httpx>=0.27", "authlib>=1.3", "python-multipart>=0.0.9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
modelhub_portal = ["templates/*.html"]
