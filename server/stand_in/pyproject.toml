[project]
name = "modelhub-stand-in"
version = "0.1.0"
description = "Test-only imitation of Artifactory's Hugging Face repository. Never delivered."
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
