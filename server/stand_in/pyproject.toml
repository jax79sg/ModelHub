[project]
name = "modelhub-stand-in"
version = "0.1.0"
description = "Test-only imitation of Artifactory's Hugging Face repository. Never delivered."
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "huggingface_hub>=2.2,<3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
modelhub_stand_in = ["assumptions.json"]
